# Generated by the Referalli monorepo (scripts/release/mirror-files); edits here are overwritten on the next sync.
# Adopted from the WS4 package CI (packages/sdk-*/ci/workflows/ci.yml); this copy is canonical.
# The package sits at the mirror repo root. In the monorepo it depends on `referalli` through
# `workspace:*`; the sync rewrites that to the released version (WS5), so this workflow installs
# from npm like any user would.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Unit tests (vitest, native modules mocked)
        run: npx vitest run
      - name: Build (ESM, CJS, types, Expo plugin)
        run: |
          rm -rf lib plugin/build
          npx tsc -p tsconfig.build.json
          npx tsc -p tsconfig.cjs.json
          npx tsc -p tsconfig.types.json
          npx tsc -p tsconfig.plugin.json
      - name: Expo plugin loads
        run: node -e "const p=require('./plugin/build/mutations.js'); if(!p.addAssociatedDomains) process.exit(1)"
      - name: Package contents
        run: npm pack --dry-run

  android:
    # Compiles the native module inside a throwaway React Native app.
    name: android native module
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: sdk
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The runner ships the Android SDK (ANDROID_HOME); android-actions/setup-android fails on its sdkmanager.
      - name: Build the package
        working-directory: sdk
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npx tsc -p tsconfig.build.json && npx tsc -p tsconfig.cjs.json && npx tsc -p tsconfig.types.json && npx tsc -p tsconfig.plugin.json
          npm pack
      - name: Create a test app and add the package
        run: |
          npx --yes @react-native-community/cli@latest init RefTest --skip-git-init --install-pods false
          cd RefTest && npm install ../sdk/referalli-react-native-*.tgz
      - name: assembleDebug
        working-directory: RefTest/android
        run: ./gradlew --no-daemon assembleDebug

  ios:
    name: ios native module
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: sdk
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the package
        working-directory: sdk
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npx tsc -p tsconfig.build.json && npx tsc -p tsconfig.cjs.json && npx tsc -p tsconfig.types.json && npx tsc -p tsconfig.plugin.json
          npm pack
      - name: Create a test app and add the package
        run: |
          npx --yes @react-native-community/cli@latest init RefTest --skip-git-init --install-pods false
          cd RefTest && npm install ../sdk/referalli-react-native-*.tgz
          cd ios && pod install
      - name: Build for the iOS simulator
        working-directory: RefTest/ios
        run: |
          set -o pipefail
          xcodebuild -workspace RefTest.xcworkspace -scheme RefTest -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -n 40
